<h2>Hooks</h2>
<p>The available lifecycle hooks are <code>beforeRun</code>, <code>afterRun</code>,
<code>beforeModel</code>, <code>afterModel</code>, <code>beforeTool</code>,
<code>afterTool</code>, and <code>onEvent</code>.</p>

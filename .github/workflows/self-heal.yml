name: Post-merge self-heal
on:
  workflow_run:
    workflows: ["CodeQL", "OpenSSF Scorecard"]
    branches: [main]
    types: [completed]
permissions: {}
jobs:
  heal:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: HikaruEgashira/gh-verify/.github/workflows/post-merge-heal.yml@534d0df958815b3f73e8b389bf216b83e5828365
    with:
      automation_ref: 534d0df958815b3f73e8b389bf216b83e5828365
      check_workflows: '["codeql.yml"]'
      post_merge_workflows: '["codeql.yml","scorecard.yml"]'
